// to easy test mini mods in advanced gameplay power (or veteran gameplay)
mm_player_skills_reset
mm_player_add_skillpoints 95 //this call can fill the entire magical tree (play like a veteran with little resources in CarefulCombat x5 to x10 enemies multiplier). To have all spells is good to have more reasons to spend mana and use bloodymana and potions.
mm_player_add_skillpoints 11 //to not be locked out of locked rooms that have no keys (but try to find the keys first) and that the lock cant be destroyed nor the door...
mm_player_add_skillpoints 18 //to access backstab functionality
mm_player_add_skillpoints 6 //to access wirlwind functionality
// you can use like mm_player_add_skillpoints -10 to remove skill points as debit later (for veteran gameplay in carefulcombat mod)

//good to determine the item ID to use with give
ent_remove 

