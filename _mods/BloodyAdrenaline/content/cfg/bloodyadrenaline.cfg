// restore all adrenaline causing a good damage
//alias BloodyAdrenaline "gskEffectON; hurtme 25; play *arkane/character_sheet/adrenaline_reached.wav; player_value_remove_from_adrenaline -20; player_time_to_remove_adrenaline 0.01; gskWait333ms; player_value_remove_from_adrenaline 1; player_time_to_remove_adrenaline 20; gskEffectOFF"

alias +BloodyAdrenaline "developer 1; echo BloodyAdrenaline; gskEffectON; hurtme 25; play *arkane/character_sheet/adrenaline_reached.wav; player_value_remove_from_adrenaline -20; player_time_to_remove_adrenaline 0.01" //this sometimes grants a second use for full adrenaline, it seems a bug that is linked to only recognize maximized adrenaline if there is a strike so the command player_value_remove_from_adrenaline -20 (full) ends up ignored sometimes and allows a second usage even without the related skill (that will probably allow a 3rd usage) but not a big deal if you use MoreFoes mod ( actually a random bless :) ).
alias BloodyAdrenalineOff "player_value_remove_from_adrenaline 1; player_time_to_remove_adrenaline 20; gskEffectOFF" // it is important to use player_value_remove_from_adrenaline 1 or you will get INFINITE consecutive adrenaline power ...
alias -BloodyAdrenaline "BloodyAdrenalineOff; developer 0;" //to hide echoed text

