// Scope Aliases (FOV and Sensitivity), fov only works after you use 2x (ent_fire do_zoom Trigger) once!
alias gskScopeHip "fov 90; ent_fire do_unzoom Trigger; sensitivity 3.0"
alias gskScope2x  "ent_fire do_zoom Trigger;      hurtme 1" //0.33 //nicer than: alias gskScope2x  "fov 45;    sensitivity 1.5;   hurtme 1"
alias gskScope4x  "fov 22.5;  sensitivity 0.75;   hurtme 2" //0.66 //hurtme only accepts integer. btw, at .qct poison damage accepts float!
alias gskScope8x  "fov 11.25; sensitivity 0.375;  hurtme 3" //1.33
alias gskScope16x "fov 5.625; sensitivity 0.1875; hurtme 4" //2.66

alias +gsk_zoom_cycle "gsk_zoom_2x"
alias -gsk_zoom_cycle "developer 0"
alias gsk_zoom_2x  "developer 1; echo 2x;  alias +eagleeye gskScope2x;  alias +gsk_zoom_cycle gsk_zoom_4x"
alias gsk_zoom_4x  "developer 1; echo 4x;  alias +eagleeye gskScope4x;  alias +gsk_zoom_cycle gsk_zoom_8x"
alias gsk_zoom_8x  "developer 1; echo 8x;  alias +eagleeye gskScope8x;  alias +gsk_zoom_cycle gsk_zoom_16x"
alias gsk_zoom_16x "developer 1; echo 16x; alias +eagleeye gskScope16x; alias +gsk_zoom_cycle gsk_zoom_2x"

alias +eagleeye "gskScope2x"
alias -eagleeye "gskScopeHip"
