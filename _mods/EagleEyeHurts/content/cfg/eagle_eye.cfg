// Scope Aliases (FOV and Sensitivity)
alias gskScopeHip "cl_fov 90;    fov 90;    sensitivity 3.0"
alias gskScope2x  "cl_fov 45;    fov 45;    sensitivity 1.5;   hurtme 1"
alias gskScope4x  "cl_fov 22.5;  fov 22.5;  sensitivity 0.75;  hurtme 2"
alias gskScope8x  "cl_fov 11.25; fov 11.25; sensitivity 0.375; hurtme 3"

alias +gsk_zoom_cycle "gsk_zoom_2x"
alias -gsk_zoom_cycle "developer 0"
alias gsk_zoom_2x "developer 1; echo 2x; alias +eagleeye gskScope2x; alias +gsk_zoom_cycle gsk_zoom_4x"
alias gsk_zoom_4x "developer 1; echo 4x; alias +eagleeye gskScope4x; alias +gsk_zoom_cycle gsk_zoom_8x"
alias gsk_zoom_8x "developer 1; echo 8x; alias +eagleeye gskScope8x; alias +gsk_zoom_cycle gsk_zoom_2x"

bind "F5" "+gsk_zoom_cycle"

alias +eagleeye "gskScope2x"
alias -eagleeye "gskScopeHip"


