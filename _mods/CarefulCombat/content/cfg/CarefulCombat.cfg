
// so you need to remember to close the door if you want
mm_player_auto_close_door_dist 10000

// NPC switcher for easy spawn to increase challenge.
// It is impossible to spawn a npc if there is another there or some item, so wait them move or aim elsewhere.
// use my keybind n to toggle noclip notarget, so you can fly and place many enemies while not being detected
// the only bad thing is that you will probably know where they all are, as they wont move from where you spawned them.. they wont patrol.
// Couldnt find a way to spawn many identical near existing foes (like a foe count increaser or multiplier injected code like skse or nvse mod could do), so spawn them with care to not make them fight each other! and to not let them see you imediately!
// SameFactionTip: see at mm_relationship.txt you can combine these without messing the map: "necrocivilian" "deathknight" "necroguard" "ghoul" "lich" "lich_king" "undead" "necromancer" "necromancer_lord"
/////////////////// REPLACE BELOW (with output of ./createNpcSpawnSwitches.sh)
