// btw, fire arrow with adrenaline will put on fire even if target saw you
arrow_always_stick	1 // this makes it stick on player too what is very cool, collect from self body! 1st hit after ricochet will stay there. Vanishes or becomes unpickable on spikes, some objects, destroyed crates will vanish with it. But stucking on rock doesnt make sense, could have a small chance 15% to not break on rock and stay on floor like quivers.
arrow_stick_on_npc	1 // when NPC dies, the arrows vanish! pick them before that!

