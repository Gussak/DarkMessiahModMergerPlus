
// so you need to remember to close the door if you want
mm_player_auto_close_door_dist 10000

// NPC switcher for easy spawn to increase challenge.
// It is impossible to spawn a npc if there is another there or some item, so wait them move or aim elsewhere.
// use my keybind n to toggle noclip notarget, so you can fly and place many enemies while not being detected, tho too many may break something as I detected the glass windows transparency broke a bit after I placed like 10 or 15 more necroguard bowman thru the map, but after I kill some and reload it fixed
// Couldnt find a way to spawn many identical near existing foes (like a foe count increaser or multiplier injected code like skse or nvse mod could do), so spawn them with care to not make them fight each other! and to not let them see you imediately!
alias gskCCnpcSwitch_0 "developer 1; echo CREATE:death_knight_shield; alias gskCCnpcSpawn mm_npc_create_death_knight_shield; alias +gskCCnpcSwitch gskCCnpcSwitch_1"
alias gskCCnpcSwitch_1 "developer 1; echo CREATE:ghoul; alias gskCCnpcSpawn mm_npc_create_ghoul; alias +gskCCnpcSwitch gskCCnpcSwitch_2"
alias gskCCnpcSwitch_2 "developer 1; echo CREATE:goblin; alias gskCCnpcSpawn mm_npc_create_goblin; alias +gskCCnpcSwitch gskCCnpcSwitch_3"
alias gskCCnpcSwitch_3 "developer 1; echo CREATE:necro_guard_bow; alias gskCCnpcSpawn mm_npc_create_necro_guard_bow; alias +gskCCnpcSwitch gskCCnpcSwitch_4"
alias gskCCnpcSwitch_4 "developer 1; echo CREATE:necromancer; alias gskCCnpcSpawn mm_npc_create_necromancer; alias +gskCCnpcSwitch gskCCnpcSwitch_5"
alias gskCCnpcSwitch_5 "developer 1; echo CREATE:orc_sword_bow; alias gskCCnpcSpawn mm_npc_create_orc_sword_bow; alias +gskCCnpcSwitch gskCCnpcSwitch_6"
alias gskCCnpcSwitch_6 "developer 1; echo CREATE:spider; alias gskCCnpcSpawn mm_npc_create_spider; alias +gskCCnpcSwitch gskCCnpcSwitch_0"
alias +gskCCnpcSwitch gskCCnpcSwitch_0
alias -gskCCnpcSwitch "developer 0"

