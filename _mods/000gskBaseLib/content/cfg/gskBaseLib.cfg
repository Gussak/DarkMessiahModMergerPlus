// this blocks user input, use with care!
alias gskWait100 "wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; wait; "

alias gskWait1s "gskWait100; gskWait100; gskWait100; " //TODO try to be more precise, is 1.00s?

// important to keep HUD visible during fadeout effect
mm_fullscreenfade 0.99

alias gskEffectON "fadeout 3 15 0 25 dummy; mm_blurscreen 1.00; mm_TestFrozenScreen 1; mm_TestPoisonBlur 1; shake; mm_player_screenshake; gskEffect020; gskWait100; gskEffect060; gskWait100; gskEffect100"

// fadein take a "long" time to not allow results to be easily used imediatelly
alias gskEffect100 "mm_blurscreen 1.00; mm_refract_underwater 1.00; mm_drawscreen_underwater 1;"
alias gskEffect080 "mm_blurscreen 0.80; mm_refract_underwater 0.80; mm_drawscreen_underwater 1;"
alias gskEffect060 "mm_blurscreen 0.60; mm_refract_underwater 0.60; mm_drawscreen_underwater 1;"
alias gskEffect040 "mm_blurscreen 0.40; mm_refract_underwater 0.40; mm_drawscreen_underwater 1;"
alias gskEffect020 "mm_blurscreen 0.20; mm_refract_underwater 0.20; mm_drawscreen_underwater 1;"
alias gskEffect000 "mm_blurscreen 0.00; mm_refract_underwater 0.01; mm_drawscreen_underwater 0;"
alias gskEffectOFF "fadein 12 15 0 25 dummy; gskWait100; gskEffect080; gskWait100; gskEffect060; gskWait100; gskEffect040; gskWait100; gskEffect020; gskWait100; gskEffect000; mm_TestFrozenScreen 0; mm_TestPoisonBlur 0;"

//BUG-WORKAROUND: when trying to do anything will keep toggling pause, this fix it.
//See gskCustomBinds mod.
//IMPORTANT! You NEED to unfocus the game, open anothe app or just minimize it if possible (like in case it can run in the background like in linux Wine), otherwise the fix will NOT kick in. The best is to focus some text app and see the cursor blinking there. Then hit the super key to visualize all window in realtime, and you will see the game window changing and know when it is ready to focus it again. It may not work sometimes tho...
//the game engine seems to auto pause sometimes once it detects input is not focused on it?
alias gskFixPauseBug gskFixPauseBugModify
alias gskFixPauseBugModify  "mat_antialias 0; alias gskFixPauseBug gskFixPauseBugRestore"
alias gskFixPauseBugRestore "mat_antialias 4; alias gskFixPauseBug gskFixPauseBugModify"

//useful in case you had full mana and swapped inventory that unequips the +100 mana ring and other equipment.
//See gskCustomBinds mod.
alias +gskFixMana "mm_player_time_to_add_mana 0.01"
alias -gskFixMana "mm_player_time_to_add_mana 3.0"

//fix shield bugging unable to equip nor drop
alias gskFixShieldsRemove "ent_remove_all weapon_mm_shield_guard; ent_remove_all weapon_mm_shield_necroguard"
alias gskFixShieldsAdd "give weapon_mm_shield_necroguard" //the many removed (may bug too tho)
