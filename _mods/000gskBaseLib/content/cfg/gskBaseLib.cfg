//Dont mess with toggles, they may get out of sync with these scripts, so do not use directly: buddha, noclip, notarget, ai_disable, unless you are careful (check them all in console if they are on/off).

alias gskEchoOn "developer 1"
alias gskEchoOff "developer 0"

// contimes 3 means 1 line shown. so always add 2

// this blocks user input, use with care!
alias gskWait6_DoNotUseDirectly "wait; wait; wait; wait; wait; wait"
alias gskWait60_DoNotUseDirectly "gskWait6_DoNotUseDirectly; gskWait6_DoNotUseDirectly; gskWait6_DoNotUseDirectly; gskWait6_DoNotUseDirectly; gskWait6_DoNotUseDirectly; gskWait6_DoNotUseDirectly; gskWait6_DoNotUseDirectly; gskWait6_DoNotUseDirectly; gskWait6_DoNotUseDirectly; gskWait6_DoNotUseDirectly"

alias gskWait33ms "gskWait6_DoNotUseDirectly"
alias gskWait100ms "gskWait6_DoNotUseDirectly; gskWait6_DoNotUseDirectly; gskWait6_DoNotUseDirectly"
alias gskWait200ms "gskWait100ms; gskWait100ms"
alias gskWait266ms "gskWait100ms; gskWait100ms; gskWait33ms; gskWait33ms"
alias gskWait333ms "gskWait60_DoNotUseDirectly"
alias gskWait1s "gskWait60_DoNotUseDirectly; gskWait60_DoNotUseDirectly; gskWait60_DoNotUseDirectly"
alias gskWait5s "gskWait1s; gskWait1s; gskWait1s; gskWait1s; gskWait1s; " //ex.: bind a "gskWait5" crouch move forward and hit 'a' shall not last more than 5s the walk

alias gskSndDONE "play *arkane/english/xana/l05_xana_pillardone.wav"

// important to keep HUD visible during fadeout effect
mm_fullscreenfade 0.99

// fadein take a "long" time to not allow results to be easily used imediatelly
alias gskEffect100 "mm_blurscreen 1.00; mm_refract_underwater 1.00; mm_drawscreen_underwater 1;"
alias gskEffect080 "mm_blurscreen 0.80; mm_refract_underwater 0.80; mm_drawscreen_underwater 1;"
alias gskEffect060 "mm_blurscreen 0.60; mm_refract_underwater 0.60; mm_drawscreen_underwater 1;"
alias gskEffect040 "mm_blurscreen 0.40; mm_refract_underwater 0.40; mm_drawscreen_underwater 1;"
alias gskEffect020 "mm_blurscreen 0.20; mm_refract_underwater 0.20; mm_drawscreen_underwater 1;"
alias gskEffect000 "mm_blurscreen 0.00; mm_refract_underwater 0.01; mm_drawscreen_underwater 0;"

alias gskEffectON "fadeout 3 10 0 25 dummy; mm_blurscreen 1.00; mm_TestFrozenScreen 1; mm_TestPoisonBlur 1; shake; mm_player_screenshake; gskEffect020; gskWait33ms; gskEffect040; gskWait33ms; gskEffect060; gskWait33ms; gskEffect080; gskWait33ms; gskEffect100" //do not use too much wait here as it blocks everything, is not only script wait, is also user controls...

alias gskEffectOFF "fadein 12 10 0 25 dummy; gskWait33ms; gskEffect080; gskWait33ms; gskEffect060; gskWait33ms; gskEffect040; gskWait33ms; gskEffect020; gskWait33ms; gskEffect000; mm_TestFrozenScreen 0; mm_TestPoisonBlur 0;" //do not use too much wait here as it blocks everything, is not only script wait, is also user controls...
alias gof gskEffectOFF //short easy helper when developing (could bind a key tho)
alias gskEffectOFF_devOnly "fadein 0 10 0 25 dummy; gskEffect000; mm_TestFrozenScreen 0; mm_TestPoisonBlur 0;" //do not reuse in aliases, is only for dev keybind

//BUG-WORKAROUND: when trying to do anything will keep toggling pause, this fix it.
//IMPORTANT! You NEED to unfocus the game, works after Super+D minimize all (just unfocus is not enough), open another app or just minimize it if possible (like in case it can run in the background like in linux Wine), otherwise the fix will NOT kick in. The best is to focus some text app and see the cursor blinking there. Then hit the super key to visualize all window in realtime, and you will see the game window changing and know when it is ready to focus it again. It may not work sometimes tho?
//the game engine seems to auto pause sometimes once it detects input is not focused on it?
// the the sound is to call attention, the pause command is to unpause after the fix
alias gskFixPauseBugModify  "developer 1; contimes 3; echo FixPauseBug:Modify; mat_antialias 0; play *arkane/english/xana/l05_xana_pillardone.wav; pause; alias gskFixPauseBug gskFixPauseBugRestore"
alias gskFixPauseBugRestore "developer 1; contimes 3; echo FixPauseBug:Restore; mat_antialias 4; play *arkane/english/xana/l05_xana_pillardone.wav; pause; alias gskFixPauseBug gskFixPauseBugModify"
alias gskFixPauseBug gskFixPauseBugModify
alias +gskFixPauseBugHelper gskFixPauseBug
alias -gskFixPauseBugHelper "developer 0"

//useful in case you had full mana and swapped inventory that unequips the +100 mana ring and other equipment.
alias gskManaRegenMax    "gskManaReg001" //doesnt make difference or dont work smaller than that right?
alias gskManaReg001      "mm_player_time_to_add_mana 0.01"
alias gskManaReg002      "mm_player_time_to_add_mana 0.02"
alias gskManaReg003      "mm_player_time_to_add_mana 0.03"
alias gskManaReg004      "mm_player_time_to_add_mana 0.04"
alias gskManaReg005      "mm_player_time_to_add_mana 0.05"
alias gskManaReg006      "mm_player_time_to_add_mana 0.06"
alias gskManaReg007      "mm_player_time_to_add_mana 0.07"
alias gskManaReg008      "mm_player_time_to_add_mana 0.08"
alias gskManaReg009      "mm_player_time_to_add_mana 0.09"
alias gskManaReg010      "mm_player_time_to_add_mana 0.10"
alias gskManaRegNormal   "mm_player_time_to_add_mana 60.00" //was 3.00 but holding the keys to raise timescale makes 3.0 pointless
alias +gskFixMana "developer 1; contimes 3; echo FixManaWorkaround:ON; gskManaRegenMax"
alias -gskFixMana "developer 0; gskManaRegNormal"

//fix skill points: helps restore from broken save into a fresh map loading, just screenshot what skills you had and both inv items, or just for dev
alias gskSkillPointAdd "mm_player_add_skillpoints 1"
alias gskSkillPointRemove "mm_player_add_skillpoints -1"

//fix shield bugging unable to equip nor drop
alias gskFixShieldsRemove "ent_remove_all weapon_mm_shield_guard; ent_remove_all weapon_mm_shield_necroguard" //shields with negative HP cannot be dropped, but they may merge? like I had 2, a 3rd bugged and one older vanished...
alias gskFixShieldsAdd "Test_CreateEntity weapon_mm_shield_guard" //add the many removed (may bug too later tho, not being able to equip them (was only cuz of negative HP?) ). both weapon_mm_shield_guard and weapon_mm_shield_necroguard bugs with negative HP often. Spawn them in the world first may help?

// target an enemy to show many info, needs developer 1, do not need to change host_timescale by using pause
alias +gskDbgEntInfo "developer 1; ent_text; pause"
alias -gskDbgEntInfo "ent_text; developer 0; pause"

alias gskDevGodModeToggles "buddha; noclip; notarget; ai_disable; showtriggers_toggle; echo INFO:showtriggers_toggle" //these are useles: "showtriggers 1; showtriggers 0;" ?

//good to fix if you get stuck in a wall unable to move like when grabbing a rope that is still shaking a lot, also to place more foes thru CarefulCombat. on first toggle will enable and fly and not be seen, on next will disable both, beware you can still touch and break physics props. buddha is in case you are in a place that got hit by arrow or weapon. Seeing the trigger boxes is utmost important to help you place them without messing the map when applying it later!!!
alias gskHelpPlaceNPCsON  "developer 1; contimes 50; echo <> <> <> GskGodMode:ON <> <> <>; gskDevGodModeToggles; mm_refract_underwater 0.10; mm_drawscreen_underwater 1; alias gskHelpPlaceNPCsToggle gskHelpPlaceNPCsOFF" // do not use host_timescale 0.01 as it will break flying
alias gskHelpPlaceNPCsOFF "developer 1; contimes 50; echo <> <> <> GskGodMode:OFF <> <> <>; gskDevGodModeToggles; mm_refract_underwater 0.00; mm_drawscreen_underwater 0; alias gskHelpPlaceNPCsToggle gskHelpPlaceNPCsON"
alias gskHelpPlaceNPCsToggle gskHelpPlaceNPCsON
alias +gskHelpPlaceNPCsToggleH "gskHelpPlaceNPCsToggle"
alias -gskHelpPlaceNPCsToggleH "developer 0" //to hide the echo text

alias +gskShowTriggers "developer 1; contimes 3; echo gskShowTriggers; showtriggers_toggle"
alias -gskShowTriggers "developer 0"

alias +gskCondump "developer 1; contimes 3; echo gskCondump; condump"
alias -gskCondump "developer 0"

alias +gskReloadCfgs "gskEchoOn; contimes 50;  exec bloodyadrenaline; exec bloodymana; exec bloodysummoner; exec CarefulCombat; exec CrouchToggle; exec eagle_eye; exec gskBaseLib; exec gskEnabledBindsOk; exec gskGfxTweaks; exec gskInvSwapPreventCrash; exec MoreFoes; exec Playability; exec skipcutscenes; exec slowmotion_toggle; echo ReloadedSomeCFGs; " //see 
alias -gskReloadCfgs "gskEchoOff"

alias gskNpcTeleport npc_teleport

alias gskDbgTest "echo DBG00001"

