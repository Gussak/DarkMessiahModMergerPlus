// alternative pause mode cycle two kinds
alias gskPause gskPauseNormal1
alias gskPauseNormal1 "pause; alias gskPause gskPauseNormal2"
alias gskPauseNormal2 "pause; alias gskPause gskPauseSuperSlowMo1"
alias gskPauseSuperSlowMo1 "mm_TestFrozenScreen 1; host_timescale 0.01; alias gskPause gskPauseSuperSlowMo2; gskEchoOn; echo PseudoPause_SuperSlowMo"
alias gskPauseSuperSlowMo2 "mm_TestFrozenScreen 0; host_timescale 1.00; alias gskPause gskPauseNormal1; gskEchoOff"

//fix skill points: helps restore from broken save into a fresh map loading, just screenshot what skills you had and both inv items, or just for dev
alias gskSkillPointAdd "mm_player_add_skillpoints 1; echo gskSpawnHint; getpos;getpos; echo gskSkillPointAdd;echo gskSkillPointAdd;"
alias gskSkillPointRemove "mm_player_add_skillpoints -1"

//fix shield bugging unable to equip nor drop
alias gskFixShieldsRemove "ent_remove_all weapon_mm_shield_guard; ent_remove_all weapon_mm_shield_necroguard" //shields with negative HP cannot be dropped, but they may merge? like I had 2, a 3rd bugged and one older vanished...
alias gskFixShieldsAdd "Test_CreateEntity weapon_mm_shield_guard" //add the many removed (may bug too later tho, not being able to equip them (was only cuz of negative HP?) ). both weapon_mm_shield_guard and weapon_mm_shield_necroguard bugs with negative HP often. Spawn them in the world first may help?

alias gskResetSpawns "ent_remove_all npc_necro_guard_bow; ent_remove_all npc_necro_guard; ent_remove_all npc_undead; ent_remove_all npc_necromancer; ent_remove_all npc_necromancer_lord; "

// target an enemy to show many info, needs developer 1, do not need to change host_timescale by using pause
alias +gskDbgEntInfo "developer 1; ent_text; pause"
alias -gskDbgEntInfo "ent_text; developer 0; pause"

alias gskDevGodModeToggles "buddha; noclip; notarget; ai_disable; showtriggers_toggle; echo INFO:showtriggers_toggle" //these are useles: "showtriggers 1; showtriggers 0;" ?

alias gskAliasErasersApply "gskEchoOn; echo AliasErasers:Apply; gskManaRegEraser; gskHMHurtmeEraser1of3; gskHMHurtmeEraser2of3; gskHMHurtmeEraser3of3; alias gskSmnWORK gskSmnWORKdev"
alias gskAliasErasersUndo "+gskReloadCfgs" //this is good but is overkill too as resets current alias selections TODO: initial alias selections could all be in a new cfg file that would not be part of the loaded ones like ...Init.cfg

//good to fix if you get stuck in a wall unable to move like when grabbing a rope that is still shaking a lot, also to place more foes thru CarefulCombat. on first toggle will enable and fly and not be seen, on next will disable both, beware you can still touch and break physics props. buddha is in case you are in a place that got hit by arrow or weapon. Seeing the trigger boxes is utmost important to help you place them without messing the map when applying it later!!!
alias gskHelpPlaceNPCsON  "developer 1; contimes 50; clear;status;status;+duck; echo <> <> <> GskGodMode:ON  <> <> <>; gskDevGodModeToggles; mm_refract_underwater 0.10; mm_drawscreen_underwater 1; gskAliasErasersApply; alias gskHelpPlaceNPCsToggle gskHelpPlaceNPCsOFF" // do not use host_timescale 0.01 as it will break flying. These clear, status, duck is to prepare for MoreFoes condump.
alias gskHelpPlaceNPCsOFF "developer 1; contimes 50; -duck;                     echo <> <> <> GskGodMode:OFF <> <> <>; gskDevGodModeToggles; mm_refract_underwater 0.00; mm_drawscreen_underwater 0; gskAliasErasersUndo;  alias gskHelpPlaceNPCsToggle gskHelpPlaceNPCsON; " //removed condump from the end, annoying too slow...
alias gskHelpPlaceNPCsToggle gskHelpPlaceNPCsON
alias +gskHelpPlaceNPCsToggleH "gskHelpPlaceNPCsToggle"
alias -gskHelpPlaceNPCsToggleH "developer 0" //to hide the echo text

alias +gskShowTriggers "developer 1; contimes 3; echo gskShowTriggers; showtriggers_toggle"
alias -gskShowTriggers "developer 0"

alias +gskCondump "developer 1; contimes 3; echo gskCondump; condump"
alias -gskCondump "developer 0"

exec gskReloadCfgs.cfg

alias gskNpcTeleport npc_teleport

alias gskDbgTest "echo DBG00001"

//alias gskWaitInteractDev "echo Used by MoreFoes placement" //see ./createNpcSpawnSwitches.sh
//alias gskInteractUseTrick "gskWaitInteractDev; +use; pause; gskWaitInteractDev; pause; gskWaitInteractDev" // only this way seems to work on every activator
//alias +gskInteractUseDev "gskInteractUseTrick; echo gskSpawnHint; getpos;getpos; echo dummyJustTeleport;echo dummyJustTeleport; echo gskSpawnHint; getpos;getpos; echo +gskInteractUseDev;echo +gskInteractUseDev" //2 times because the interaction + and - must happen totally after the teleport!!! and the waits is to wait a bit just after the teleport and let doors or windows etc open fully. Using pause 2 times, key the interaction kick in (better than auto opening and closing the console)
alias +gskInteractUseDev "+use; echo gskSpawnHint; getpos;getpos; echo dummyJustTeleport;echo dummyJustTeleport; echo gskSpawnHint; getpos;getpos; echo +gskInteractUseMoreFoes;echo +gskInteractUseMoreFoes" //dummyJustTeleport is essential because the interaction + and - must happen totally after the teleport!!!
alias -gskInteractUseDev "-use"

alias +gskInteractUseMoreFoes "gskWait333ms; +use; pause; gskWait333ms; pause; gskWait333ms" // only this way seems to work on every activator. pause is better than toggling console (that would work too). the waits is to wait a bit just after the teleport and let doors or windows etc open fully. Using pause 2 times, to let the interaction kick in (better than auto opening and closing the console)
alias -gskInteractUseMoreFoes "-use"



