// put failed  tests inside alias because dotcomma will exec cmd after comment line :O
alias _pauseFAIL "gskWait5s; gskWait1s; pause"

echo "OS_SystemMacroCommand=PauseGame"

//condump no, this can trigger helper scripts...
//clear //this is important in case of condump*.txt is being monitored to not match old lines as they have no timestamp

// resume with F1 from skip cutscenes or this new pause button bind
bind pause "pause; host_timescale 1.0" //this is good to keep like that
alias _pauseFAIL "gskWait1s;gskWait1s;gskWait1s;gskWait1s;gskWait1s;host_timescale 0.001" // this fails because it will lower the speed before we can access the console and menus...

