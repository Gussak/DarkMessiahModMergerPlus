// my personal keybinds TODO create menu entry for all

bind g "exec game.cfg" //this may be overkill as it forces a last savegame reload (dont know why tho), but seems to fix any .cfg that failed to load initially (see unifiedGameCfg.sh instead tho).

unbind m //was notarget cheat
bind m +gskFixMana //(IMPORTANT) enable only if you can control yourself to not cheat, use the BloodyMana mod instead

bind n +gskHelpPlaceNPCsToggleHelper

bind p +gskFixPauseBugHelper

bind d gskFixShieldsRemove
bind s gskFixShieldsAdd

// for CarefulCombat extra enemies spawner
bind f7 +gskCCnpcSwitch
bind f8 gskCCnpcSpawn
bind z ent_remove

// show detailed entity info
bind t +gskDbgEntInfo

// bloody summon
bind 1 gskSummonSpiderMini
bind 2 gskSummonSpiderRegular
bind 3 gskSummonFacehugger
bind 6 gskSummonCurePoison
bind 7 gskSummonPotionLife
bind 8 gskSummonPotionMana
bind 9 gskSummonPotionStone
bind 0 "bind 1; bind 2; bind 3; bind 4; bind 5; bind 6; bind 7; bind 8; bind 9" //like a help, will show on console

// CarefulCombat
bind x gskCCnpcSpawn_next

// bloody kill
bind k +gskKillTarget

// bloody teleport
bind w +gskTeleMark
bind e +gskTeleRecallSelect
bind r +gskTeleRecallActivate

