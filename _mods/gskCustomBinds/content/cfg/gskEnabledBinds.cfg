// my personal keybinds

bind g "exec game.cfg" //this may be overkill as it forces a last savegame reload (dont know why tho), but seems to fix any .cfg that failed to load initially (see unifiedGameCfg.sh instead tho).

unbind m //was notarget cheat
bind m +gskFixMana //(IMPORTANT) enable only if you can control yourself to not cheat, use the BloodyMana mod instead

bind n "noclip; notarget" //(default?) good to fix if you get stuck in a wall unable to move like when grabbing a rope that is still shaking a lot, also to place more foes thru CarefulCombat. on first toggle will enable and fly and not be seen, on next will disable both

bind p gskFixPauseBug

bind d gskFixShieldsRemove
bind s gskFixShieldsAdd

// for CarefulCombat extra enemies spawner
bind f7 +gskCCnpcSwitch
bind f8 gskCCnpcSpawn

// show detailed entity info
bind t +gskDbgEntInfo
