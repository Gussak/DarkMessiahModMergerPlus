// my personal keybinds

bind g "exec game.cfg" //this may be overkill as it forces a last savegame reload (dont know why tho), but seems to fix any .cfg that failed to load initially (see unifiedGameCfg.sh instead tho).

unbind m //was notarget cheat
bind m +gskFixMana //(IMPORTANT) enable only if you can control yourself to not cheat, use the BloodyMana mod instead

//good to fix if you get stuck in a wall unable to move like when grabbing a rope that is still shaking a lot, also to place more foes thru CarefulCombat. on first toggle will enable and fly and not be seen, on next will disable both, beware you can still touch and break physics props. buddha is in case you are in a place that got hit by arrow or weapon
alias gskHelpPlaceNPCsON  "noclip; notarget; buddha; mm_refract_underwater 0.10; mm_drawscreen_underwater 1; alias gskHelpPlaceNPCsToggle gskHelpPlaceNPCsOFF"
alias gskHelpPlaceNPCsOFF "noclip; notarget; buddha; mm_refract_underwater 0.00; mm_drawscreen_underwater 0; alias gskHelpPlaceNPCsToggle gskHelpPlaceNPCsON"
alias gskHelpPlaceNPCsToggle gskHelpPlaceNPCsON
bind n gskHelpPlaceNPCsToggle

bind p gskFixPauseBug

bind d gskFixShieldsRemove
bind s gskFixShieldsAdd

// for CarefulCombat extra enemies spawner
bind f7 +gskCCnpcSwitch
bind f8 gskCCnpcSpawn

// show detailed entity info
bind t +gskDbgEntInfo
