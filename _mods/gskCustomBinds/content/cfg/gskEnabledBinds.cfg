// my personal keybinds

bind g exec game.cfg //this may be overkill as it forces a last savegame reload (dont know why tho), but seems to fix any .cfg that failed to load initially (see unifiedGameCfg.sh tho).

unbind m //was notarget cheat
bind m +gskFixMana //(IMPORTANT) enable only if you can control yourself to not cheat, use the BloodyMana mod instead

bind n noclip //(default?) good to fix if you get stuck in a wall unable to move like when grabbing a rope that is still shaking a lot

bind p gskFixPauseBug

bind d gskFixShieldsRemove
bind s gskFixShieldsAdd

// target an enemy to show many info (needs: developer 1)
alias +gskDbgEntInfo "developer 1; ent_text; pause"
alias -gskDbgEntInfo "ent_text; developer 0; pause"
bind t +gskDbgEntInfo
