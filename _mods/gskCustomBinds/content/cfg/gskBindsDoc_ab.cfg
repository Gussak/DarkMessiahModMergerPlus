echo [ALIAS] [+]gskTeleportTargetPos
echo ..[BM]TeleSelf:ToTargetLocation
echo ..Teleport at aimed position. You need a clear sight to where you want to teleport. Even spider web in the path will create a barrier, so try to spawn there first a gskSummonDevDummyMarker, if it works you activate the targetted teleport. as this is prone to BUG placing you in a bad location, a quick save is auto generated.
echo
echo [ALIAS] [+]gskMoveThruWall
echo ..[BM]TeleSelfInFrontHoldKeyDmgX2
echo ..BloodyMagic: Teleport Self in front to where you are aiming just a bit to help move thru a wall, floor or even ceiling (if you are touching it).
echo ....Hold the key to teleport, use a life potion, release the key (that damages you again!).
echo
echo [ALIAS] [+]gskDestroyToMana
echo ..[BM]DestroyToMana(Caution)
echo ..BloodyMagic: Destroy objects to get a bit of mana.
echo ....Beware, use with caution:
echo ......- don't aim to fire or it will crash,
echo ......- don't aim at non objects or something you dont want to be removed.
echo ....Use to 'consume' objects that otherwise would just vanish like dup weapons.
echo ....Use to 'consume' things that may be useful like anything that can be throwed or become a barrier.
echo ....Don't use in corpses as they can be raised by necromancers and you lose the challenge.
echo
