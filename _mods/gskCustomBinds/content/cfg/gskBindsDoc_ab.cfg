echo [ALIAS] [+]gskDestroyToMana
echo 	[BM]DestroyToMana(Caution)
echo 	BloodyMagic: Destroy objects to get a bit of mana.
echo ..	Beware, use with caution:
echo ..		- don't aim to fire or it will crash,
echo ..		- don't aim at non objects or something you dont want may be removed.
echo ..	Use to 'consume' objects that otherwise would just vanish like dup weapons.
echo ..	Don't use in corpses as they can be raised by necromancers and you lose the challenge.
echo
