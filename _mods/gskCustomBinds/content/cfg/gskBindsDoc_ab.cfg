echo [ALIAS] gskSummonFood
echo ..[BM]SummonFood
echo ..BloodyMagic: Summon Food
echo ....This is the inital way for infinite HP and Mana, and takes time to prepare (so you wont get stuck without HP or Mana this way):
echo ......1) Summon food 2 times, that costs HP15x2=30 [-30HP],
echo ......2) eat it 2 times that gives HP10x2=20 [+20HP] Mana10x2=20,
echo ......3) magic heal yourself with costing Mana10x2=20 for [+20HP] and you end with +40HP!
echo ....Beyond that way, ring with manaregen buff will make it a bit easier (I dont want to remove the ring as it is not configurable, so or you have both more mana and more regen or you get nothing, I wanted just more mana and no rege but...).
echo
echo [ALIAS] [+]gskSummonGuardBow
echo ..[BM]SummonFriendHoldKeyDmgX2
echo ..BloodyMagic: Summon a Friendly ranged guard with bow.
echo ....Hold key to spawn, use life potion, release key (that damages you again).
echo
