// This file is also a database for createBindsMenu.sh
// this is only for binding aliases, so all lines with '"' will be ignored. Create the aliases elsewhere.

// my personal keybinds. Do not enable this. It is just a data file for createBindsMenu.sh. The chosen keys on binding can be all the same HERE as now they can be configured in the menu and will all be discarded by the script.

//bind g "exec game.cfg" //this may be overkill as it forces a last savegame reload (dont know why tho), but seems to fix any .cfg that failed to load initially (see unifiedGameCfg.sh instead tho).

//unbind m //was notarget cheat //be careful whne using unbindall too

//(IMPORTANT) enable only if you can control yourself to not cheat (this is just to fix lost mana in case you swap inventories and the mana ring gets unequipped), use the BloodyMana mod instead
bind m +gskFixMana //Fix MANA lost by inv swap

bind p +gskFixPauseBugHelper //Fix PAUSE bug when you can't move

bind d gskFixShieldsRemove
bind s gskFixShieldsAdd

// for CarefulCombat extra enemies spawner
bind f7 +gskCCnpcSwitch //Create NPC: choose
bind f8 +gskCCnpcSpawn  //Create NPC: spawn
//bind z "ent_remove;npc_kill"

// show detailed entity info
bind t +gskDbgEntInfo //Debug Entity Info (aim and hold)

// bloody summon
bind 1 gskSummonSpiderMini
bind 2 gskSummonSpiderRegular
bind 3 gskSummonFacehugger
bind 4 gskSummonUndead
bind 5 gskSummonNecroGuardBow
bind 6 gskSummonPotionCurePoison
bind 7 gskSummonPotionLife
bind 8 gskSummonPotionMana
bind 9 gskSummonPotionStone
bind 0 gskSummonSeagull
//as chosen key is pointless, and using "-" will break the script, just repeated '=' below
bind = gskSummonDog
bind = +gskSummonGuardBow //BldMgc:SummonFriendHoldKeyUseHealDmgX2
//FullNiceDescription: BloodyMagic: Summon a Friendly ranged guard with bow. Hold key to spawn, use life potion, release key (that damages you again).

bind F10 +gskShowSummonKeyBindsHelp

// CarefulCombat
bind x gskCCnpcSpawn_next //MoreFoes: Create Next NPC

// bloody kill
bind k +gskKillTarget //BloodyMagic: Kill Target

// bloody teleport
bind w +gskTeleMark //BloodyMagic: Teleport Mark
bind e +gskTeleRecallSelect //BloodyMagic: Teleport Select
bind r +gskTeleRecallActivate //BloodyMagic: Teleport Recall

// dev helpers
bind n +gskHelpPlaceNPCsToggleHelper //MoreFoes: Toggle GOD mode place NPCs
bind i +gskShowTriggers //Developer: Show trigger boxes (yellow)
bind u +gskCondump
bind q +gskReloadCfgs //Reload a safe list of config files
bind = gskEffectOFF_devOnly

// bloody heal NPC (blood transfusion)
bind h gskNpcFullyHeal //BloodyMagic: Heal any NPC

// bloody show NPC route
bind l +gskNpcTelepathy //BldMgc: Telepathy show NPC route vision
//FullNiceDescription: BloodyMagic: Telepathy shows NPC route and vision

// bloody teleport NPC
bind a +gskNpcMark //BloodyMagic: Mark an NPC for later
bind y gskNpcMarkedTeleport //BldMgc: Teleport 1 marked NPC to aimed
//FullNiceDescription: BloodyMagic: Teleport one marked NPC to aimed spot

// eagle eye
bind F5 +gsk_zoom_cycle //EagleEye: Choose Zoom
