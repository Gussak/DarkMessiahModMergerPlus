// This file is also a database for createBindsMenu.sh
// this is only for binding aliases, so all lines with '"' will be ignored. Create the aliases elsewhere."
// my personal keybinds. Do not enable this. It is just a data file for createBindsMenu.sh.
// The chosen keys on binding can be all the SAME HERE as now they can be configured in the menu and will all be discarded by the script.

// eagle eye
bind F5 +gsk_zoom_cycle //EagleEye: Choose Zoom

// CarefulCombat
bind x gskCCnpcSpawn_next //MoreFoes:MapDev: Create Next NPC
bind = gskMapDevDropPotionLife //MoreFoes:MapDev: Create Life Potion

// bloody kill
bind k +gskKillTarget //BloodyMagic: Kill Target

// bloody heal NPC (blood transfusion)
bind h gskNpcFullyHeal //BloodyMagic: Heal any NPC

// bloody show NPC route
bind l +gskNpcMarkedTelepathy //BldMgc:Show NPC Route Vision //FullNiceDescription: BloodyMagic: Telepathy shows marked NPCs route and vision

// bloody teleport NPC
bind a +gskNpcMark //BloodyMagic: Mark an NPC for later
bind y gskNpcMarkedTeleport //BldMgc: Tele 1 marked NPC to aimed //FullNiceDescription: BloodyMagic: Teleport one marked NPC to aimed spot

// bloody summon
bind 0 gskSummonSeagull
bind = gskSummonDog
bind = gskSummonCrow
bind = gskSummonPig
bind 1 gskSummonSpiderMini
bind 2 gskSummonSpiderRegular
bind 3 gskSummonFacehugger
bind 4 gskSummonUndead
bind 5 gskSummonNecroGuard
bind 5 gskSummonNecromancer
bind 6 gskSummonPotionCurePoison
bind 7 gskSummonPotionLife
bind 8 gskSummonPotionMana
bind 9 gskSummonPotionStone
bind 0 gskSummonClub
bind 0 gskSummonStaff
bind 0 gskSummonSword
bind 0 gskSummonFood
//as chosen key is pointless, and using "-" will break the script, just repeated '=' below
bind = +gskSummonGuardBow //BldMgc:SummonFriendHoldKeyDmgX2 //FullNiceDescription: BloodyMagic: Summon a Friendly ranged guard with bow. Hold key to spawn, use life potion, release key (that damages you again).
bind F10 +gskShowSummonKeyBindsHelp

// bloody teleport
bind = +gskTeleMark //BldMgc: Teleport Self: Mark Location
bind = +gskTeleMarkerSelectNext //BldMgc: Teleport Self: Select Location
bind = gskTeleMarkerRecall //BldMgc:TeleSelf:RecallSelectedLocation //FullNiceDescription: BloodyMagic: Teleport Self: Recall Selected Location
bind = +gskTeleMarkerDelete //BldMgc:TeleSelf:Del Selected Mark Locat //FullNiceDescription: BloodyMagic: Teleport Self: Delete Currently Selected Marked Location
bind = +gskTeleportUp //BldMgc:TeleSelf:High upwards
bind = +gskMoveThruWall //BldMgc:TeleSelfHoldKeyDmgX2 //FullNiceDescription: BloodyMagic: Teleport Self in front just a bit to help move thru a wall. Hold the key to teleport, use a life potion, release the key (that damages you again!).


//////////////////// TECH STUFF

//(IMPORTANT) enable only if you can control yourself to not cheat (this is just to fix lost mana in case you swap inventories and the mana ring gets unequipped), use the BloodyMana mod instead
bind m +gskFixMana //Fix MANA lost by inv swap

// dev helpers
bind n +gskHelpPlaceNPCsToggleH //[DEV]MoreFoes:ToggleGODmode to placeNPCs //FullNiceDescription: [DEV]MoreFoes: Toggle GOD mode to place NPCs
bind i +gskShowTriggers //[DEV]: Show trigger boxes (yellow)
bind q +gskReloadCfgs //Reload a safe list of config files
bind = +gskSkillsErase //[Blood Magic]: reset skills //FullNiceDescription: [Blood Magic]: reset skills but before that, screenshot or memorize what skills you had. Also you may want to do it 2 times, another after reloading, just to be sure the total amount of skill points you will need to add.
bind = +gskSkillsAdd1Point //[Blood Magic]: give 1 skill point
bind = gskSkillPointAdd //[DEV/Fix]: add 1 skill point
bind = gskSkillPointRemove //[DEV/Fix]: remove 1 skill point

// for CarefulCombat extra enemies spawner
bind f7 +gskCCnpcSwitch //[DEV]: Create NPC: choose
bind f8 +gskCCnpcSpawn  //[DEV]: Create NPC: spawn
//bind z "ent_remove;npc_kill"

// show detailed entity info
bind t +gskDbgEntInfo //[DEV]: Debug Entity Info (aim and hold)

bind u +gskCondump
bind ";" gskEffectOFF_devOnly //[DEV]:DisableVisualBlockingEffects

// bug fixers
bind p +gskFixPauseBugHelper //[Fix] PAUSE bug when you can't move
bind d gskFixShieldsRemove //[Fix] Remove all shields (necro/guard) //FullNiceDescription: [Fix] Remove all shields (necro/guard), count them before doing that to properly add later (could based on their remaining HP)
bind s gskFixShieldsAdd //[Fix] Add one shield (necroguard)
bind = +gskInvSwapPreventCrash //[Fix] Swap Inventory Safely


