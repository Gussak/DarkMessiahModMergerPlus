// This file is also a database for createBindsMenu.sh
// this is only for binding aliases, so all lines with '"' will be ignored. Create the aliases elsewhere."
// my personal keybinds. Do not enable this. It is just a data file for createBindsMenu.sh.
// The chosen keys on binding can be all the SAME HERE as now they can be configured in the menu and will all be discarded by the script.

// eagle eye
bind F5 +gsk_zoom_cycle //EagleEye: Choose Zoom

bind = gskSuperJump //Super Jump HP105 //FullNiceDescription: Super Jump Max HP105, you cannot jump while holding some objet to be thrown.
bind = gskSuperJumpMax //Super Jump Max HP150 //FullNiceDescription: Super Jump Max HP150, you cannot jump while holding some objet to be thrown.
bind = +gskSuperJumpDouble //Super Jump Double HP204 //FullNiceDescription: Super Jump Double HP204, you cannot jump while holding some objet to be thrown.
bind = +gskSuperJumpMaxDouble //Super Jump Max Double HP300 //FullNiceDescription: Super Jump Max Double HP300, you cannot jump while holding some objet to be thrown.

// CarefulCombat
bind x +gskCCnpcSpawn_next //MoreFoes:MapDev: Create Next NPC
bind = gskMapDevDropPotionLife //MoreFoes:MapDev: Create Life Potion

// bloody kill
bind = +gskKillTarget //[BM]Kill Target (no BOSS)
bind = +gskKillTargetPiercing //[BM]Kill 3 Targets (no BOSS)
bind = +gskKillBoss //[BM]Kill BOSS Target //FullNiceDescription: BloodyMagic: can use with BOSS like dragon, cyclope etc

// bloody heal NPC (blood transfusion)
bind h gskNpcFullyHeal //[BM]Heal any NPC

// bloody show NPC route
bind l +gskNpcMarkedTelepathy //[BM]Show NPC Route Vision //FullNiceDescription: BloodyMagic: Telepathy shows marked NPCs route and vision

// bloody teleport NPC
bind a +gskNpcMark //[BM]Mark an NPC for later
bind y gskNpcMarkedTeleport //[BM]Tele 1 marked NPC to aimed //FullNiceDescription: BloodyMagic: Teleport one marked NPC to aimed spot

// bloody summon
bind 0 gskSummonSeagull
bind = gskSummonDog
bind = gskSummonCrow
bind = gskSummonPig
bind 1 gskSummonSpiderMini
bind 2 gskSummonSpiderRegular
bind 3 gskSummonFacehugger
bind 4 gskSummonUndead
bind 5 gskSummonNecroGuard
bind 5 gskSummonNecromancer
bind 6 gskSummonPotionCurePoison
bind 7 gskSummonPotionLife
bind = gskCreateLifePotionFromOilJar //[BM]SummonLifeFromOil //FullNiceDescription: the idea is:\n\t- To summon oil jar costs 100HP.\n\t- Life potion gives 100HP.\n\t- You cant carry oil jars.\nThis conversion is equivalent to pickup the oil jar, but it is limited by the life potion stack.
bind 8 gskSummonPotionMana
bind 9 gskSummonPotionStone
bind 0 gskSummonClub
bind 0 gskSummonStaff
bind 0 gskSummonSword
bind 0 gskSummonFood //[BM]SummonFood //FullNiceDescription: BloodyMagic: Summon Food\n\tThis is the inital way for infinite HP and Mana, and takes time to prepare (so you wont get stuck without HP or Mana this way):\n\t\t1) Summon food 2 times, that costs HP15x2=30 [-30HP],\n\t\t2) eat it 2 times that gives HP10x2=20 [+20HP] Mana10x2=20,\n\t\t3) magic heal yourself with costing Mana10x2=20 for [+20HP] and you end with +40HP!\n\tBeyond that way, ring with manaregen buff will make it a bit easier (I dont want to remove the ring as it is not configurable, so or you have both more mana and more regen or you get nothing, I wanted just more mana and no rege but...).
//as chosen key is pointless, and using "-" will break the script, just repeated '=' below
bind = +gskSummonGuardBow //[BM]SummonFriendHoldKeyDmgX2 //FullNiceDescription: BloodyMagic: Summon a Friendly ranged guard with bow.\n\tHold key to spawn, use life potion, release key (that damages you again).
bind F10 +gskShowSummonKeyBindsHelp
bind = +gskSummonVillager
bind = +gskSummonXanaIllusion
bind = +gskSummonCorpse
// these let you just cycle thru them all
bind = +gskGPSmnSpawn      //[BM]Summon selected //FullNiceDescription: BloodyMagic: Summon the selected Spawn entity where you are pointing at.\n\tIf it was well spawned, it will also be properly named as gskSpawnNameOk.\n\tThat naming is helpful to later make it easier to determine what Spawn can be removed from the gskmap config file for easier maintenance.
bind = +gskGPSmnSwitchPrev //[BM]Summon select previous
bind = +gskGPSmnSwitch     //[BM]Summon select next


bind = +gskMagicTorch

// bloody teleport
bind = +gskTeleMark //[BM]Teleport Self: Mark Location
bind = +gskTeleMarkerSelectNext //[BM]Teleport Self: Select Location
bind = gskTeleMarkerRecall //[BM]TeleSelf:RecallSelectedLocationHP15 //FullNiceDescription: BloodyMagic: Teleport Self: Recall Selected Location
bind = +gskTeleMarkerDelete //[BM]TeleSelf:Del Selected Mark Locat //FullNiceDescription: BloodyMagic: Teleport Self: Delete Currently Selected Marked Location
bind = +gskTeleportUp //[BM]TeleSelf:High upwards
bind = +gskTeleportTargetPos //[BM]TeleSelf:target location
bind = +gskMoveThruWall //[BM]TeleSelfInFrontHoldKeyDmgX2 //FullNiceDescription: BloodyMagic: Teleport Self in front to where you are aiming just a bit to help move thru a wall, floor or even ceiling (if you are touching it).\n\tHold the key to teleport, use a life potion, release the key (that damages you again!).

bind = +gskDestroyToMana //[BM]DestroyToMana(Caution) //FullNiceDescription: BloodyMagic: Destroy objects to get a bit of mana.\n\tBeware, use with caution:\n\t\t- don't aim to fire or it will crash,\n\t\t- don't aim at non objects or something you dont want to be removed.\n\tUse to 'consume' objects that otherwise would just vanish like dup weapons.\n\tUse to 'consume' things that may be useful like anything that can be throwed or become a barrier.\n\tDon't use in corpses as they can be raised by necromancers and you lose the challenge.

//bind = +gskSkipCutscenes0500 //Speed +x5  -x1
//bind = +gskSkipCutscenes1000 //Speed +x10 -x1
bind = +gskSkipCutscenes0500
bind = +gskSkipCutscenes1000

bind = gskPause //alt pause mode two kinds

bind = +gskAllCmds_previous
bind = +gskAllCmds_activate
bind = +gskAllCmds_next


//////////////////// TECH STUFF

//(IMPORTANT) enable only if you can control yourself to not cheat (this is just to fix lost mana in case you swap inventories and the mana ring gets unequipped), use the BloodyMana mod instead
bind m +gskFixMana //Fix MANA lost by inv swap

// dev helpers
bind n +gskHelpPlaceNPCsToggleH //[DEV]MoreFoes:ToggleGODmode to placeNPCs //FullNiceDescription: [DEV]MoreFoes: Toggle GOD mode to place NPCs
bind i +gskShowTriggers //[DEV]: Show trigger boxes (yellow)
bind q +gskReloadCfgs //Reload a safe list of config files
bind = +gskSkillsErase //[BM]reset skills //FullNiceDescription: [Blood Magic]: reset skills but before that, screenshot or memorize what skills you had.\n\tAlso you may want to do it 2 times, another after reloading, just to be sure the total amount of skill points you will need to add.
bind = +gskSkillsAdd1Point //[BM]Give1SkillPts(ResetSkills) //FullNiceDescription: [Blood Magic]: give 1 skill point to restore all you lost after reset skills
bind = gskSkillPointAdd //[DEV/Fix]: add 1 skill point
bind = gskSkillPointRemove //[DEV/Fix]: remove 1 skill point

// for CarefulCombat extra enemies spawner
bind = +gskCCnpcSpawn      //[DEV]: Create NPC: spawn
bind = +gskCCnpcSwitchPrev //[DEV]: Create NPC: select previous
bind = +gskCCnpcSwitch     //[DEV]: Create NPC: select next
//bind z "ent_remove;npc_kill"

bind = gskNpcTeleport //[AI_Fix]Teleport Marked NPC //FullNiceDescription: As most friendly NPCs can't understand orders, use this to tactically reposition them.\n\tDo not use with FOES!!! see gskNpcMarkedTeleport instead!!!

// show detailed entity info
bind t +gskDbgEntInfo //[DEV]: Debug Entity Info (aim and hold)

bind u +gskCondump
bind ";" gskEffectOFF_devOnly //[DEV]:DisableVisualBlockingEffects

// bug fixers
bind p +gskFixPauseBugHelper //[Fix] PAUSE bug when you can't move
bind d gskFixShieldsRemove //[Fix]RemoveAllShieldsEverywhere(ISSUE)  //FullNiceDescription: [Fix] Remove all shields (necro/guard) stuck in your inventory (negative HP) as you can't drop nor equip them.\n\tCount them before doing that to properly add later (better be based on their remaining HP sum then div by max HP).\n\tISSUE: this will remove all shields spawned in the whole map level too everywhere including with guards!!!\n\tbetter go back to a previous map before applying this fix or use just before leaving the current map.\n\tISSUE: Unfortunately you cant place shields with negative HP in the swap inventory.
bind s gskFixShieldsAdd //[Fix] Add one basic shield
bind = +gskInvSwapPreventCrash //[Fix] Swap Inventory Safely


