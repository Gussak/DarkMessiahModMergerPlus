//bloody chaos magic (should be die and resurrect tho, or at least ragdoll player)
alias +gskKillTarget "developer 1; npc_kill; hurtme 99; gskSndDONE; gskWait1s; gskWait1s; gskEffect100; gskWait1s; gskWait1s; gskWait1s; gskWait1s; gskWait1s; gskWait1s; gskWait1s; gskWait1s; gskEffectOFF" //do not use "buddha; hurtme 9999; buddha;" as it will be able to use at 1 HP. TODO: Too powerful, should damage 99% of the MaxHP tho, so need to be fully healed.
alias -gskKillTarget "developer 0" //needs to be here or if just after npc_kill it will not kick it...

alias gskNpcFullyHeal "npc_heal;hurtme 33"

// to use other functions. you can mark many
alias +gskNpcMark "developer 1;npc_select"
alias -gskNpcMark "developer 0"

// you will be able to detect them thru walls
alias +gskNpcMarkedTelepathy "developer 1;npc_route;npc_viewcone;hurtme 3"
alias -gskNpcMarkedTelepathy "developer 0"

// you can teleport one per time, but can be anyone (like into a fire). Do not use "buddha; hurtme 9999; buddha;" as it will be able to use at 1 HP. TODO: Too powerful, should damage 99% of the MaxHP tho, so need to be fully healed.
alias gskNpcMarkedTeleport "npc_teleport;hurtme 99"

alias +gskShowSummonKeyBindsHelp "developer 1; contimes 15; echo Bloody Summon; bind 1; bind 2; bind 3; bind 4; bind 5; bind 6; bind 7; bind 8; bind 9; bind 0; bind -; bind =;" //like a help, will show on console
alias -gskShowSummonKeyBindsHelp "developer 0"
