// Converts HP into summons
sv_cheats "1"

alias gskFinaliseBloodMagic "gskWait1s; gskWait1s; gskManaRegNormal; gskEffectOFF"

alias gskSummonWORK "gskEffectON; play *arkane\use_item\mana_potion.wav; gskFinaliseBloodMagic"

// summoning bad things will grant you minor manaregen (calc: (100 - hurtme)/1000 "round" "gskManaReg001" )
alias gskSummonSpiderMini    "mm_npc_create_spider_mini;     hurtme  3; gskManaReg010; gskSummonWORK"
alias gskSummonSpiderRegular "mm_npc_create_spider;          hurtme 14; gskManaReg009; gskSummonWORK" //jumping on them is instakill. falls to fire. low HP
alias gskSummonFacehugger    "mm_npc_create npc_facehugger models/NPC/Facehugger/Npc_Facehugger.mdl; hurtme 21; gskManaReg008; gskSummonWORK" // falls to fire. low HP but can fly (and area damage?)
alias gskSummonUndead        "mm_npc_create_undead;          hurtme 66; gskManaReg005; gskSummonWORK" //high HP
alias gskSummonNecroGuardBow "mm_npc_create_necro_guard_bow; hurtme 75; gskManaReg003; gskSummonWORK" //high HP and ranged but better not use it as it will just mean easy arrows for you
alias gskSummonNecroGuard    "mm_npc_create_necro_guard;     hurtme 70; gskManaReg003; gskSummonWORK" //high HP
alias gskSummonNecromancer   "mm_npc_create_necromancer;     hurtme 99; gskManaReg001; gskSummonWORK" //ranged, wont drop easy ammo, high HP

// good things
alias +gskSummonGuardBow      "mm_npc_create_human_guard_bow; hurtme 99" //high HP, ranged and friendly! (you can also teleport it later)
alias -gskSummonGuardBow      "hurtme 99; gskSummonWORK" //hold to spawn, open inventory or use quick key to use a healing potion
alias gskSummonPotionCurePoison "give item_potion_cure_poison; hurtme 14; gskSummonWORK" //it doesnt work from healing spell right? ISSUE: all poisoning is lethal, it is impossible to limit poisoning duration right? so it was lowered from hurtme 33
alias gskSummonPotionLife    "give item_potion_life; hurtme 99; gskSummonWORK" //blood bag for later, can convert from food or when being healead for free
alias gskSummonPotionMana    "give item_potion_mana; hurtme 99; gskSummonWORK" // like bloody mana conversion (more precise actually but demands too much HP but can be stored!)
alias gskSummonPotionStone   "give item_potion_stone; hurtme 66; gskSummonWORK"
alias gskSummonClub          "give weapon_club; hurtme 1; gskSummonWORK" //as some times we can't even punch (but I guess it is only in dev tests anyway)

// these are useless, may be add code to make them attack at least? but the mini spider is already almost useless even commanded  to it...
alias gskSummonCrow    "mm_npc_create npc_crow models/npc/crow/npc_crow.mdl; hurtme 1; gskSummonWORK"
alias gskSummonSeagull "mm_npc_create npc_seagull models/npc/seagull/npc_seagull.mdl; hurtme 1; gskSummonWORK"
alias gskSummonDog     "mm_npc_create npc_dog models/npc/dog/npc_dog.mdl; hurtme 2; gskSummonWORK"
alias gskSummonPig     "mm_npc_create npc_pig models/npc/pig/pig.mdl; hurtme 2; gskSummonWORK"


/////////////////////////// extras (could be other mini mods)

