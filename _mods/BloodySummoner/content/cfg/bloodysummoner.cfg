// Converts HP into summons
sv_cheats "1"

alias gskSummonWORK "gskEffectON; play *arkane\use_item\mana_potion.wav; gskWait1s; gskWait1s; gskEffectOFF"
alias gskSummonSpiderMini    "mm_npc_create_spider_mini; hurtme 3; gskSummonWORK"
alias gskSummonSpiderRegular "mm_npc_create_spider; hurtme 21; gskSummonWORK"
alias gskSummonFacehugger    "mm_npc_create npc_facehugger models/NPC/Facehugger/Npc_Facehugger.mdl; hurtme 33; gskSummonWORK"
alias gskSummonCurePoison    "give item_potion_cure_poison; hurtme 33; gskSummonWORK" //it doesnt work from healing spell right?
alias gskSummonPotionLife    "give item_potion_life; hurtme 99; gskSummonWORK" //blood bag for later
alias gskSummonPotionMana    "give item_potion_mana; hurtme 99; gskSummonWORK" // like bloody mana conversion (more precise actually but demands too much HP)
alias gskSummonPotionStone   "give item_potion_stone; hurtme 66; gskSummonWORK"

// these are useless, may be add code to make them attack at least? but the mini spider is already almost useless even commanded  to it...
alias gskSummonCrow    "mm_npc_create npc_crow models/npc/crow/npc_crow.mdl; hurtme 1; gskSummonWORK"
alias gskSummonSeagull "mm_npc_create npc_seagull models/npc/seagull/npc_seagull.mdl; hurtme 1; gskSummonWORK"
alias gskSummonDog     "mm_npc_create npc_dog models/npc/dog/npc_dog.mdl; hurtme 1; gskSummonWORK"
alias gskSummonPig     "mm_npc_create npc_pig models/npc/pig/pig.mdl; hurtme 1; gskSummonWORK"





