// Converts HP into summons
sv_cheats "1"

alias gskFinaliseBloodMagic "gskWait1s; gskWait1s; gskManaRegNormal; gskEffectOFF"

alias gskSummonWORK "gskEffectON; play *arkane\use_item\mana_potion.wav; gskFinaliseBloodMagic"

// summoning bad things will grant you minor manaregen (calc: (100 - hurtme)/1000 "round" "gskManaReg001" )
alias gskSummonSpiderMini    "mm_npc_create_spider_mini;     hurtme   3; gskManaReg010; gskSummonWORK"
alias gskSummonSpiderRegular "mm_npc_create_spider;          hurtme  14; gskManaReg009; gskSummonWORK" //jumping on them is instakill. falls to fire. low HP
alias gskSummonFacehugger    "mm_npc_create npc_facehugger models/NPC/Facehugger/Npc_Facehugger.mdl; hurtme 21; gskManaReg008; gskSummonWORK" // falls to fire. low HP but can fly (and area damage?)
alias gskSummonUndead        "mm_npc_create_undead;          hurtme  66; gskManaReg005; gskSummonWORK" //high HP
alias gskSummonNecroGuardBow "mm_npc_create_necro_guard_bow; hurtme  75; gskManaReg003; gskSummonWORK" //high HP and ranged but better not use it as it will just mean easy arrows for you
alias gskSummonNecroGuard    "mm_npc_create_necro_guard;     hurtme  70; gskManaReg003; gskSummonWORK" //high HP
alias gskSummonNecromancer   "mm_npc_create_necromancer;     hurtme 100; gskManaReg001; gskSummonWORK" //ranged, wont drop easy ammo, high HP

// good things
alias +gskSummonGuardBow      "mm_npc_create_human_guard_bow; hurtme 100; gskEchoOn; echo Drink other healing potion now!" //high HP, ranged and friendly! (you can also teleport it later)
alias -gskSummonGuardBow      "gskEchoOff; hurtme 100; gskSummonWORK" //hold to spawn, open inventory or use quick key to use a healing potion
alias +gskSummonVillager "mm_npc_create npc_villager_male models/npc/villager_male/npc_villager_male.mdl; hurtme 10" //meat shield
alias -gskSummonVillager ""
alias gskSummonPotionCurePoison "give item_potion_cure_poison; hurtme 14; gskSummonWORK" //it doesnt work from healing spell right? ISSUE: all poisoning is lethal, it is impossible to limit poisoning duration right? so it was lowered from hurtme 33
alias gskSummonPotionLife    "give item_potion_life; hurtme 100; gskSummonWORK" //blood bag for later, can convert from food or when being healead for free
alias gskSummonPotionMana    "give item_potion_mana; hurtme 100; gskSummonWORK" // like bloody mana conversion (more precise actually but demands too much HP but can be stored!)
alias gskSummonPotionStone   "give item_potion_stone; hurtme 66; gskSummonWORK"
alias gskSummonFood          "give item_food_bread01_cooked; hurtme 15; gskSummonWORK" // sync with food healing *1.5 as now it also gives mana

alias gskSummonClub          "give weapon_club; hurtme 1; gskSummonWORK" //as on beggining we can't even punch (but I guess it is only in dev tests anyway) ISSUE: doesnt work at L00? 
alias gskSummonStaff         "give weapon_mm_staff_wood; hurtme 1; gskSummonWORK"
alias gskSummonSword         "give weapon_arx_short_sword; hurtme 1; gskSummonWORK" // that is the one guards drop, but is identical to this: weapon_arxsword

// these are useless, may be add code to make them attack at least? but the mini spider is already almost useless even commanded  to it...
alias gskSummonCrow    "mm_npc_create npc_crow models/npc/crow/npc_crow.mdl; hurtme 1; gskSummonWORK"
alias gskSummonSeagull "mm_npc_create npc_seagull models/npc/seagull/npc_seagull.mdl; hurtme 1; gskSummonWORK"
alias gskSummonDog     "mm_npc_create npc_dog models/npc/dog/npc_dog.mdl; hurtme 2; gskSummonWORK"
alias gskSummonPig     "mm_npc_create npc_pig models/npc/pig/pig.mdl; hurtme 2; gskSummonWORK"


/////////////////////////// extras (could be other mini mods)

//depends on external app: ./createTeleportMarkers.sh
alias gskTeleEchoReloadInfo "echo Hold key while teleport marker is being prepared, when you hear it is ready, release it." //needs to wait a bit before the cfg is created and loaded
alias gskTeleMarkersWaitReady "gskWait1s; gskWait1s; gskWait1s" // adjust to your preferences
alias gskTeleMarkersReload "exec gskTeleMarkers; gskEchoOn; echo Reloaded gskTeleMarkers.cfg; gskEchoOff"
//alias +gskTeleMark "clear; status;status;status; echo gskTeleMarkerDrop; condump; hurtme 3; gskWait1s; gskEffect100; gskWait1s; gskWait1s; gskEffectOFF; gskTeleMarkersWaitReady; gskTeleMarkersReload" //needs to wait a bit before the cfg is created and loaded
alias +gskTeleMark "clear; status;status;status; gskEchoOn; echo gskTeleMarkerDrop; echo gskTeleMarkerName _AUTOMATIC_; condump; hurtme 3; gskEffectON; gskTeleEchoReloadInfo" 
alias -gskTeleMark "gskEffectOFF; gskTeleMarkersReload"
alias +gskTeleMarkerDelete "clear; status;status;status; alias;alias;alias; echo gskTeleMarkerDelete=CurrentOneSelected; condump; gskEffectON; alias +gskTeleMarkerSelectNext gskTeleMarkersReload; gskTeleEchoReloadInfo" // +gskTeleMarkerSelectNext is overriden to grant pressing it's key will force a proper reload (that also fixed it back to default behaviour)
alias -gskTeleMarkerDelete "gskEffectOFF; gskTeleMarkersReload"
alias gskTeleEffectDebuff "mm_player_freeze; gskEffect100; gskWait1s; gskEffect080; gskWait1s; gskEffect060; gskWait1s; gskEffect040; gskWait1s; gskEffect020; gskWait1s; gskEffectOFF; mm_player_unfreeze"
alias gskTeleMarkerRecallEffects "hurtme 15; gskTeleEffectDebuff"

alias +gskTeleportUp "save gskB4TeleUp; clear; status;status; getpos;getpos; echo gskTeleportUpPrepareHint; condump; gskEffectON; hurtme 33" // as this is prone to BUG placing you in a bad location, a quick save is auto generated.
alias -gskTeleportUp "gskTeleMarkersReload; gskTeleportUpApply; gskTeleEffectDebuff"

alias +gskMoveThruWall "save gskB4TeleInFrontThruWall; hurtme 100; noclip; +forward; gskWait33ms; -forward; noclip; gskEffectON; gskEchoOn; echo Drink other healing potion now!"
alias -gskMoveThruWall "gskEchoOff; gskEffectOFF; hurtme 100; gskTeleEffectDebuff"

// created (overrriden) at createTeleportMarkers.sh
alias gskTeleMarkerRecall "gskTeleMarkersReload"
alias +gskTeleMarkerSelectNext "gskTeleMarkersReload"
alias -gskTeleMarkerSelectNext "gskTeleMarkersReload"
alias gskTeleportUpApply "gskTeleMarkersReload"

//bloody chaos magic (should be die and resurrect tho, or at least ragdoll player)
alias +gskKillTarget "developer 1; npc_kill; hurtme 100; gskManaRegMax; gskEffectON; gskWait1s; gskEffect080; gskWait1s; gskEffect060; gskWait1s; gskEffect040; gskWait1s; gskEffect020; gskWait1s; gskManaRegNormal; gskEffectOFF" //do not use "buddha; hurtme 9999; buddha;" as it will be able to use at 1 HP. TODO: Too powerful, should damage 99% of the MaxHP tho, so need to be fully healed.
alias -gskKillTarget "developer 0" //needs to be here or if just after npc_kill it will not kick it...

alias gskNpcFullyHeal "npc_heal;hurtme 33"

// to use other functions. you can mark many
alias +gskNpcMark "developer 1;npc_select"
alias -gskNpcMark "developer 0"

// you will be able to detect them thru walls
alias +gskNpcMarkedTelepathy "developer 1;npc_route;npc_viewcone;hurtme 1" //was hurtme 3, but you have to use it on each NPC to disable and enable
alias -gskNpcMarkedTelepathy "developer 0"

// you can teleport one per time, but can be anyone (like into a fire). Do not use "buddha; hurtme 9999; buddha;" as it will be able to use at 1 HP. TODO: Too powerful, should damage 99% of the MaxHP tho, so need to be fully healed.
alias gskNpcMarkedTeleport "npc_teleport;hurtme 100"

alias +gskShowSummonKeyBindsHelp "developer 1; contimes 15; echo Bloody Summon; bind 1; bind 2; bind 3; bind 4; bind 5; bind 6; bind 7; bind 8; bind 9; bind 0; bind -; bind =;" //like a help, will show on console
alias -gskShowSummonKeyBindsHelp "developer 0"

alias +gskSkillsErase "save gskB4SkillErase; mm_player_skills_reset; hurtme 100; gskEffectON; gskEchoOn; clear; echo BLOOD MAGIC; gskWait1s; clear; echo BLOOD MAGIC Forg; gskWait1s; clear; echo BLOOD MAGIC Forget; gskWait1s; clear; echo BLOOD MAGIC Forgetti; gskWait1s; clear; echo BLOOD MAGIC Forgetting A; gskWait1s; clear; echo BLOOD MAGIC Forgetting All; gskWait1s; clear; echo BLOOD MAGIC Forgetting All I; gskWait1s; clear; echo BLOOD MAGIC Forgetting All I K; gskWait1s; clear; echo BLOOD MAGIC Forgetting All I Kn; gskWait1s; clear; echo BLOOD MAGIC Forgetting All I Know; gskWait1s; clear; echo Give yourself skill points enough to restore the skills, but then, use it in other skills; gskWait1s" //to fully read first time player can just open the console
alias -gskSkillsErase "gskEchoOff; gskEffectOFF"
alias +gskSkillsAdd1Point "mm_player_add_skillpoints 1; hurtme 1; gskEffect100" // put no wait here to not annoy
alias -gskSkillsAdd1Point "gskEffect000"

alias +gskDestroyToMana "ent_remove; hurtme 1; gskManaReg001; gskWait333ms; gskWait333ms; gskManaRegNormal" //beware, use with caution, dont aim to fire or it will crash, dont aim at non objects or something you dont want may be removed, use to "consume" objects that otherwise would just vanish like dup weapons. dont use in corpses as they can be raised by necromancers.
alias -gskDestroyToMana ""

