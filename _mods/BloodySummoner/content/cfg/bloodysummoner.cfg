alias +gskTeleMark "clear; status; status; echo gskDropTeleportMarker; condump; hurtme 3; gskWait1s; gskEffect100; gskWait1s; gskWait1s; gskEffectOFF" //needs to wait a bit before creating and loading the cfg
alias -gskTeleMark "exec gskTeleMarkers"
