// Applies visual debuff and damages the player. Is a power that consumes HP to be used.

// Command to toggle slow motion
sv_cheats 1

// gradative effect
alias gskSlowMo_x3999 "host_timescale 0.3999; phys_pushscale 24; cl_phys_timescale 0.4666; mm_blurscreen 1.00"
alias gskSlowMo_x4999 "host_timescale 0.4999; phys_pushscale 18; cl_phys_timescale 0.5966; mm_blurscreen 0.75"
alias gskSlowMo_x6666 "host_timescale 0.6666; phys_pushscale 12; cl_phys_timescale 0.7333; mm_blurscreen 0.50"
alias gskSlowMo_x8333 "host_timescale 0.8333; phys_pushscale  6; cl_phys_timescale 0.8655; mm_blurscreen 0.25"
alias gskSlowMo_xNorm "host_timescale 1.0000; phys_pushscale  1; cl_phys_timescale 1.0000; mm_blurscreen 0.00"

alias gskSlowMo_EffectON "play *arkane/monsters/cyclope/cyclope_whoosh05.wav; fadeout 12; hurtme 10; "
alias gskSlowMo_EffectOFF "fadein 3"

// toggler
alias ToggleSlowMotionGSK "SlowMotionOn"
//ISSUE: To kick in, it should be fast and not hinder player movement with `wait` cmd
//alias SlowMotionOn  "gskSlowMo_EffectON;  gskSlowMo_x8333; gskSlowMo_x6666; gskSlowMo_x4999; gskSlowMo_x3999; alias ToggleSlowMotionGSK SlowMotionOff"
alias SlowMotionOn  "gskSlowMo_EffectON;  gskSlowMo_x3999; alias ToggleSlowMotionGSK SlowMotionOff"
//To stop it can have a delay preventing player commands, like a impairing debuff, so you need to time your slowmotion to avoid damage in a safe place
alias SlowMotionOff "gskSlowMo_EffectOFF; -forward; -moveleft; -back; -moveright; gskWait1s; gskSlowMo_x4999; gskWait1s; gskSlowMo_x6666; gskWait1s; gskSlowMo_x8333; gskWait1s; gskSlowMo_xNorm; alias ToggleSlowMotionGSK SlowMotionOn"

//to disable On Game Load to grant wont bug and cheat in case it was enabled
