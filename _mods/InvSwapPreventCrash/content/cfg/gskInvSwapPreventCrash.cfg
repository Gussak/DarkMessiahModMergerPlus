// The fadout effect is to hint you shall not try to do anything to prevent the crash
// add more gskWait1s if it still crashes
// To open inventory 4s is safe

alias +gskInvSwapPreventCrash "fadeout 0.5 0 0 50 dummy; swapinv; gskWait1s; gskWait1s; gskWait1s; gskWait1s; " 

