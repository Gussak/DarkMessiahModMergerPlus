// Converts HP into Mana. Restore mana after causing damage

sv_cheats "1"
gskManaRegenNormal

// basically this converts food and healing potions into fast mana regen (the values are imprecise tho, I can grant spent HP but not gained mana...)
alias BloodyManaWork "gskEffectON; play *arkane\use_item\mana_potion.wav; gskWait1s; gskWait1s; gskWait1s; gskWait1s; gskWait1s; gskManaRegenNormal; gskEffectOFF" //this is slow, 5s, but is much more precise using gskManaReg004 that gives 10 mana
alias +BloodyManaHardCore "developer 1; echo BloodyMana:Hardcore; hurtme 10; gskManaReg004; BloodyManaWork" //recovers 10 mana in normal regen and 52 mana in max regen. This demands that the healing spell must spend 52 mana to recover 10hp as we cannot detect if the player has the normal or the max regen activated...
alias -BloodyManaHardCore "developer 0"

// This, on later game, if you get powerful magic healing and mana regen, will let you OR have max mana or have max HP, not both. 
//TODO healing magic could spend all mana to restore all HP? or just much more mana to make it not worth alternate using both, like in or you use magic or you use combat.
alias +BloodyMana "developer 1; echo BloodyMana; gskEffectON; buddha; hurtme 1000; buddha; play *arkane\use_item\mana_potion.wav; gskManaReg003"
alias BloodyManaOff "gskManaRegenNormal; gskEffectOFF"
alias -BloodyMana "BloodyManaOff; developer 0"
// removed from kvpatch: "+BloodyMana"		"#menu_controls_bloodymana"

