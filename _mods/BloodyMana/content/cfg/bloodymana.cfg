// Converts HP into Mana. Restore mana after causing damage

sv_cheats "1"
mm_player_time_to_add_mana "3.0"

// basically this converts food and healing potions into fast mana regen (the values are imprecise tho, I can grant spent HP but not gained mana...)
alias BloodyManaWork "gskEffectON; play *arkane\use_item\mana_potion.wav; gskWait1s; gskWait1s; gskWait1s; gskWait1s; gskWait1s; mm_player_time_to_add_mana 3.0; gskEffectOFF" //this is slow, 5s, but is much more precise using mm_player_time_to_add_mana 0.04 that gives 10 mana
alias +BloodyManaHardCore "developer 1; echo BloodyMana:Hardcore; hurtme 10; mm_player_time_to_add_mana 0.04; BloodyManaWork" //recovers 10 mana in normal regen and 52 mana in max regen. This demands that the healing spell must spend 52 mana to recover 10hp as we cannot detect if the player has the normal or the max regen activated...
alias -BloodyManaHardCore "developer 0"

