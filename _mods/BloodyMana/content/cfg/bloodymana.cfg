// Converts HP into Mana. Restore mana after causing damage

sv_cheats "1"
gskManaRegNormal; mm_player_time_to_add_mana 60.00 //ISSUE: it seems that while a cfg is being loaded, the alias gskManaRegNormal is not still ready to be used? so keep mm_player_time_to_add_mana here in sync with it

// basically this converts food and healing potions into fast mana regen (the values are imprecise tho, I can grant spent HP but not gained mana...)
alias BloodyManaWork "gskEffectON; play *arkane\use_item\mana_potion.wav; gskWait1s; gskWait1s; gskWait1s; gskWait1s; gskWait1s; gskManaRegNormal; gskEffectOFF" //this is slow, 5s, but is much more precise using gskManaReg006 that must give less LTE 10 mana (the whole point should be 1x1 conversion, no extra gain, but less is ok just more difficult)
alias +BloodyManaHardCore "developer 1; echo BloodyMana:Hardcore; hurtme 10; gskManaReg006; BloodyManaWork" //must not recover more than 10 but is very imprecise... Max mana regen skill was disabled as we cannot detect if the player has the normal or the max regen activated...
alias -BloodyManaHardCore "developer 0"

// This, on later game, if you get powerful magic healing and mana regen, will let you OR have max mana or have max HP, not both. 
//TODO healing magic could spend all mana to restore all HP? or just much more mana to make it not worth alternate using both, like in or you use magic or you use combat.
alias +BloodyMana "developer 1; echo BloodyMana; gskEffectON; buddha; hurtme 1000; buddha; play *arkane\use_item\mana_potion.wav; gskManaReg003"
alias BloodyManaOff "gskManaRegNormal; gskEffectOFF"
alias -BloodyMana "BloodyManaOff; developer 0"
// removed from kvpatch: "+BloodyMana"		"#menu_controls_bloodymana"

