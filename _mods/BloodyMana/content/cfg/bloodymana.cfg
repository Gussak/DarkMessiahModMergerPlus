// This, on later game, if you get powerful magic healing and mana regen, will let you OR have max mana or have max HP, not both. 
//TODO healing magic could spend all mana to restore all HP? or just much more mana to make it not worth alternate using both, like in or you use magic or you use combat.
alias +BloodyMana "developer 1; echo BloodyMana; gskEffectON; buddha; hurtme 1000; buddha; play *arkane\use_item\mana_potion.wav; mm_player_time_to_add_mana 0.03"
alias BloodyManaOff "mm_player_time_to_add_mana 3.0; gskEffectOFF"
alias -BloodyMana "BloodyManaOff; developer 0"
