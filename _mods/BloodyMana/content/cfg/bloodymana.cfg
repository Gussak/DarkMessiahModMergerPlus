// Converts HP into Mana. Restore mana after causing damage

sv_cheats "1"
mm_player_time_to_add_mana "3.0"

// This is easier on the beggining, but later feels more like cheating by using healing spell
//alias BloodyMana "gskEffectON; hurtme 20; play *arkane\use_item\mana_potion.wav; mm_player_time_to_add_mana 0.01; gskWait1s; gskWait1s; gskWait1s; mm_player_time_to_add_mana 3.0; gskEffectOFF"

// This, on later game, if you get powerful magic healing and mana regen, will let you OR have max mana or have max HP, not both. 
//TODO healing magic could spend all mana to restore all HP? or just much more mana to make it not worth alternate using both, like in or you use magic or you use combat.
alias +BloodyMana "gskEffectON; buddha; hurtme 1000; buddha; play *arkane\use_item\mana_potion.wav; mm_player_time_to_add_mana 0.03"
alias BloodyManaOff "mm_player_time_to_add_mana 3.0; gskEffectOFF"
alias -BloodyMana "BloodyManaOff"

