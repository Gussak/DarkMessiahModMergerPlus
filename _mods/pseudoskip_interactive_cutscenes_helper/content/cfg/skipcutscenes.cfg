sv_cheats 1

bind "f1" "host_timescale 1.0" // if an interactive cutscene ends while speedup, during loading screen this will be ignored unfortunately, you need to press it just after the game resumes.
//bind "f2" "host_timescale 5.0" // this is perfect, but also be careful
//bind "f3" "host_timescale 10" // this may cause problems like the first interactive cutscene that we mount a horse, when moving thru the gate the horse may get stuck there requiring a reload
//bind "f4" "host_timescale 50" // be careful using this, just comment the whole line if you prefer

// this works much better. F1 above is just for safety.
alias +SkipCutscenes0500 "host_timescale  5.0";
alias -SkipCutscenes0500 "host_timescale  1.0";
alias +SkipCutscenes1000 "host_timescale 10.0";
alias -SkipCutscenes1000 "host_timescale  1.0";
alias +SkipCutscenes5000 "host_timescale 50.0";
alias -SkipCutscenes5000 "host_timescale  1.0";
bind f2 +SkipCutscenes0500;
bind f3 +SkipCutscenes1000;
bind f4 +SkipCutscenes5000;
