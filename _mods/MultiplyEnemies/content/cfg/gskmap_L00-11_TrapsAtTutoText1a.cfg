echo " Be sure You are standing:          -duck"
echo " Be sure You cannot fly (OFF):      NoClip"
echo " Be sure Foes can detect you (OFF): NoTarget"
echo " Be sure AI is (Enabled):           AI_Disable"
echo " Be sure You are not immune (OFF):  Buddha"
echo "A simple way is:"
echo " - Stand up (as will auto crouch to help fit and positioning)."
echo " - Enable and disable gskDevGodModeToggles and read the final status for each power, just to be sure all toggles are reset (as unfortunately we can't set them (right?)... only toggle... or NPC deployment may go out of control)."
echo " - Close the console. While you can bind +gskCCnpcSpawn_next to a key like F4 (that will work with the console opened), it will not work when releasing the key to execute -gskCCnpcSpawn_next."
