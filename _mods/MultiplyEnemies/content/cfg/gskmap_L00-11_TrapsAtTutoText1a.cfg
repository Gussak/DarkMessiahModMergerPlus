echo "Now, repeatedly press the key to spawn the next NPC: +gskCCnpcSpawn_next, but WAIT for the finished spawn sound or it will BUG(spawns 2 or more in a single location)!!!"
echo "You will be in developer mode and carefully teleported to the location and rotation required for the spawning and without triggering anything."
echo "Obs.: your vision is blurred to the spawn and location be a surprise."
